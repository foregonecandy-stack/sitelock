services:
  - type: web
    name: lockwood-net
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: PORT
        value: 10000
      # --- Backup no GitHub (persistência de dados) ---
      # Preencha GITHUB_TOKEN e GITHUB_REPO no dashboard da Render
      # (Environment) para ativar o backup automático do banco de dados.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_DB_PATH
        value: lockwood_db.json
